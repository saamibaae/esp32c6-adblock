[env:esp32-c6]
platform       = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board          = esp32-c6-devkitm-1
framework      = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_size = 4MB
monitor_speed    = 115200
upload_speed     = 921600
; ESP32-C6 USB-CDC re-enumerates after reset — --after no_reset stops pySerial
; from trying to close a port that already vanished, eliminating OSError(22).
upload_flags     = --after no_reset
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.12.0
    esp32async/AsyncTCP          @ ^3.5.0
    bblanchon/ArduinoJson        @ ^7.3.0